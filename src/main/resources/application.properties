# Kafka bootstrap; override via env KAFKA_BOOTSTRAP_SERVERS
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# topics
topic.trades=trades-normalized
topic.execs=executions-normalized

# Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# CSV paths (can override via CLI args)
app.trades.path=data/trades.csv
app.execs.path=data/executions.csv
